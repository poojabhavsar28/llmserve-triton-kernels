name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install triton   # lets the Triton kernel tests run in CPU-interpreter mode
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/verify.py --skip-server
