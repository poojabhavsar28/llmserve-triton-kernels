name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,kernels]"
      - run: ruff check .
      - run: TRITON_INTERPRET=1 pytest -q -k "not test_kernel_matches_reference_on_gpu"
      - run: python scripts/verify.py --skip-server
